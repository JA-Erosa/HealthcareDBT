name: synthea_project
version: 1.0.0
config-version: 2

profile: synthea_profile

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
data-paths: ["data"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_modules"

models:
  synthea_project:
    +materialized: view

    staging:
      +schema: staging
      +materialized: view
      patients:
      encounters:
      conditions:

    marts:
      +schema: marts
      +materialized: table

snapshots:
  synthea_project:
    +target_schema: snapshots
    +strategy: check